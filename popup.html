<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Refresh Em All</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.png" type="image/png">
    <style>
        body {
            width: 350px;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: sans-serif;
            padding: 10px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .header img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #1558d6;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background-color: #0f3f9e;
        }

        button:disabled {
            background-color: #a9a9a9;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .refresh-explanation {
            margin: 8px 0 0;
            color: #5f6368;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }

        #cancelRefresh {
            display: none;
            background-color: #5f6368;
        }

        #loadingContainer {
            width: 100%;
            margin-top: 15px;
            display: none;
        }

        #progressBar {
            width: 100%;
            height: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background-color: #1558d6;
            border-radius: 5px;
            transition: width 75ms linear;
        }

        #tabsContainer {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 10px;
        }

        .tab-item {
            position: relative;
            width: 30px;
            height: 30px;
            background-color: #f0f0f0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .tab-item img {
            width: 16px;
            height: 16px;
        }

        .tab-status {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-circle {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: #1558d6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .tab-success {
            color: #137333;
            font-size: 18px;
            display: none;
            animation: fadeIn 0.15s ease;
        }

        .tab-error {
            color: #c5221f;
            font-size: 18px;
            display: none;
            animation: fadeIn 0.15s ease;
        }

        .tab-skipped {
            color: #5f6368;
            font-size: 20px;
            display: none;
            animation: fadeIn 0.15s ease;
        }

        #errorContainer {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
            display: none;
        }

        #historyContainer {
            width: 100%;
            margin-top: 15px;
            display: none;
        }

        #historyHeader {
            margin: 0;
        }

        #historyContent {
            display: none;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        #settingsContainer {
            width: 100%;
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        #settingsHeader {
            margin: 0;
        }

        #settingsContent {
            display: none;
            width: 100%;
            padding: 10px 0;
        }

        .privacy-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .section-header {
            appearance: none;
            width: 100%;
            padding: 5px;
            border: 0;
            background: transparent;
            color: #1558d6;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            overflow: visible;
        }

        .section-header:hover {
            background: #f5f7fa;
        }

        button:focus-visible,
        .section-header:focus-visible {
            outline: 3px solid #0b3b8c;
            outline-offset: 2px;
        }

        #errorDetails {
            white-space: pre-wrap;
        }

        .history-entry {
            padding: 5px 0;
            font-size: 12px;
        }

        .history-success {
            color: #137333;
        }

        .history-failure {
            color: #c5221f;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 8px;
            height: 12px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(calc(100vh + 20px)) rotate(720deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            #confetti {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="assets/icon-refresh-em-colorful-32.png" alt="" aria-hidden="true" />
        <h2>Refresh Em All</h2>
    </div>
    <div class="action-buttons">
        <button id="refreshAll">Refresh All Tabs</button>
        <button id="cancelRefresh">Cancel</button>
    </div>
    <p class="refresh-explanation">Reloads accessible tabs while bypassing local cache. Site data remains intact.</p>

    <div id="loadingContainer">
        <div id="progressBar" role="progressbar" aria-label="Refresh progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill"></div>
        </div>
        <div id="statusText" aria-live="polite">Refreshing tabs...</div>
        <div id="tabsContainer"></div>
    </div>

    <div id="errorContainer">
        <div id="errorSummary"></div>
        <div id="errorDetails" style="margin-top: 5px; font-size: 12px;"></div>
    </div>

    <div id="historyContainer">
        <button id="historyHeader" class="section-header" type="button" aria-expanded="false" aria-controls="historyContent">View Refresh History</button>
        <div id="historyContent"></div>
    </div>

    <div id="settingsContainer">
        <button id="settingsHeader" class="section-header" type="button" aria-expanded="false" aria-controls="settingsContent">Settings</button>
        <div id="settingsContent">
            <div class="privacy-info">
                Refresh Em All processes refresh state locally. It does not send telemetry or browsing data to external servers.
            </div>
        </div>
    </div>

    <div id="confetti"></div>
    <script src="popup.js"></script>
</body>

</html>
