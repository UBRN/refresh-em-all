<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Refresh Em All</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.png" type="image/png">
    <style>
        :root {
            color-scheme: light dark;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;

            --t-sm: 12px;
            --t-base: 13px;
            --t-md: 15px;
            --t-lg: 20px;
            --t-hero: 28px;
            --s1: 4px;
            --s2: 8px;
            --s3: 12px;
            --s4: 16px;
            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-pill: 999px;

            /* Motion: five durations, one ease-out, two damped springs. Only transform
               and opacity move; colors may fade. */
            --d-instant: 90ms;
            --d-fast: 140ms;
            --d-base: 220ms;
            --d-medium: 300ms;
            --d-slow: 560ms;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-exit: cubic-bezier(0.4, 0, 1, 1);
            /* Damping ratio 0.8, about 1.5 percent overshoot: slots and views. */
            --spring-settle: linear(0, 0.05, 0.165, 0.307, 0.452, 0.585, 0.7, 0.793, 0.865, 0.919, 0.957, 0.983, 1, 1.009, 1.014, 1.015, 1.015, 1.013, 1.011, 1.009, 1.007, 1.005, 1.003, 1.002, 1.001, 1.001, 1);
            /* Damping ratio 0.6, about 9 percent overshoot: only the result badge and dots. */
            --spring-pop: linear(0, 0.063, 0.212, 0.399, 0.587, 0.753, 0.887, 0.985, 1.048, 1.083, 1.094, 1.091, 1.078, 1.061, 1.043, 1.026, 1.013, 1.003, 0.996, 0.993, 0.991, 0.991, 0.992, 0.994, 0.996, 0.997, 1);
            --shift: 6px;
            --view-in: 24px;
            --view-out: -16px;

            --bg: #ffffff;
            --surface: #f6f7f9;
            --surface-2: #eceff3;
            --line: #e3e6eb;
            --line-soft: #eef0f3;
            --text: #15171c;
            --muted: #5b6270;
            --accent: #2563eb;
            --accent-hover: #1d4fd8;
            --accent-press: #1a44bb;
            --accent-soft: #eef3ff;
            --on-accent: #ffffff;
            --ok: #0f7a3d;
            --ok-fill: #15964a;
            --on-ok: #ffffff;
            --ok-soft: #e7f6ed;
            --bad: #c62828;
            --bad-soft: #fdecec;
            --dot-pending: #dfe3e9;
            --shadow-btn: 0 1px 2px rgba(16, 24, 40, 0.10), 0 1px 1px rgba(16, 24, 40, 0.06);
            /* Confetti colors: the icon's blue, its badge green, and the accent. */
            --confetti-1: #3b76f6;
            --confetti-2: #15964a;
            --confetti-3: #1d4fd8;
            --confetti-4: #7aa7ff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181b;
                --surface: #1f2125;
                --surface-2: #282b31;
                --line: #33373e;
                --line-soft: #26292e;
                --text: #ebedf0;
                --muted: #a3aab6;
                --accent: #8fb8ff;
                --accent-hover: #a8c8ff;
                --accent-press: #c2d8ff;
                --accent-soft: #1d2638;
                --on-accent: #0d1b2a;
                --ok: #5fd38d;
                --ok-fill: #3ccf7a;
                --on-ok: #0f1a12;
                --ok-soft: #15291d;
                --bad: #f2837c;
                --bad-soft: #351e1e;
                --dot-pending: #33373e;
                --shadow-btn: 0 1px 2px rgba(0, 0, 0, 0.5);
                --confetti-1: #6d9bff;
                --confetti-2: #3ccf7a;
                --confetti-3: #8fb8ff;
                --confetti-4: #c2d8ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            width: 360px;
            height: 480px;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: var(--t-base);
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        /* Nothing animates while the popup opens. */
        .preload *,
        .preload *::before,
        .preload *::after {
            transition: none !important;
            animation: none !important;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .num {
            font-variant-numeric: tabular-nums;
        }

        .one {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .frame {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .bar {
            position: relative;
            height: 52px;
            flex: none;
            display: grid;
            align-items: center;
            padding: 0 var(--s4);
            overflow: clip;
        }

        .bar > .hv {
            grid-area: 1 / 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            transition: opacity var(--d-fast) var(--ease-exit), transform var(--d-fast) var(--ease-exit), visibility 0s linear var(--d-fast);
        }

        .bar > .hv:not(.on) {
            opacity: 0;
            visibility: hidden;
        }

        .bar > .hv.home:not(.on) {
            transform: translateX(var(--view-out));
        }

        .bar > .hv.sub:not(.on) {
            transform: translateX(var(--view-in));
        }

        .bar > .hv.on {
            transition: opacity var(--d-base) var(--ease-out) 40ms, transform var(--d-medium) var(--spring-settle) 40ms, visibility 0s;
        }

        .app-icon {
            width: 24px;
            height: 24px;
            flex: none;
        }

        .app-name,
        .sub-title {
            margin: 0;
            font-size: var(--t-md);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .back {
            appearance: none;
            border: 0;
            background: none;
            width: 32px;
            height: 32px;
            margin-left: -8px;
            border-radius: var(--r-md);
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--text);
            transition: background-color var(--d-fast) var(--ease-out);
        }

        .back:hover {
            background: var(--surface-2);
        }

        .run-pill {
            position: absolute;
            right: var(--s4);
            top: 50%;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--t-sm);
            color: var(--muted);
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity var(--d-base) var(--ease-out);
        }

        .run-pill.on {
            opacity: 1;
        }

        .run-pill svg {
            transform: rotate(-90deg);
        }

        .ring-track {
            stroke: var(--surface-2);
        }

        .ring-fill {
            stroke: var(--accent);
        }

        /* Views: home and one sub view share a cell, so the frame never resizes. */
        /* Hidden views wait just off to the side; clip them so they never widen the page. */
        .views {
            position: relative;
            flex: 1;
            min-height: 0;
            display: grid;
            overflow: clip;
        }

        .view {
            grid-area: 1 / 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            transition: opacity var(--d-fast) var(--ease-exit), transform var(--d-fast) var(--ease-exit), visibility 0s linear var(--d-fast);
        }

        .view:not(.on) {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .view.home:not(.on) {
            transform: translateX(var(--view-out));
        }

        .view.sub:not(.on) {
            transform: translateX(var(--view-in));
        }

        .view.on {
            transition: opacity var(--d-base) var(--ease-out) 40ms, transform var(--d-medium) var(--spring-settle) 40ms, visibility 0s;
        }

        .view.home {
            padding: 0 var(--s4) var(--s4);
        }

        /* Stage: three fixed slots. Variants of a slot share its grid cell. */
        .stage {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-rows: 76px 44px minmax(0, 1fr);
            gap: var(--s3);
            padding-top: var(--s1);
            padding-bottom: var(--s3);
        }

        .slot {
            display: grid;
            min-height: 0;
        }

        .slot > .v {
            grid-area: 1 / 1;
            min-width: 0;
            min-height: 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(var(--shift));
            pointer-events: none;
            transition: opacity var(--d-fast) var(--ease-exit), transform var(--d-fast) var(--ease-exit), visibility 0s linear var(--d-fast);
        }

        .slot > .v.on {
            opacity: 1;
            visibility: visible;
            transform: none;
            pointer-events: auto;
            transition: opacity var(--d-base) var(--ease-out) var(--delay), transform var(--d-medium) var(--spring-settle) var(--delay), visibility 0s;
        }

        .slot-hero {
            --delay: 60ms;
        }

        .slot-action {
            --delay: 100ms;
        }

        /* Detail has two rows: most variants span both; "top" variants leave the
           second row to the this-tab action. */
        .slot-detail {
            --delay: 140ms;
            grid-template-rows: minmax(0, 1fr) auto;
            row-gap: var(--s2);
        }

        .slot-detail > .v {
            grid-area: 1 / 1 / 3 / 2;
        }

        .slot-detail > .v.top {
            grid-area: 1 / 1 / 2 / 2;
        }

        .slot-detail > .v.ta-row {
            grid-area: 2 / 1 / 3 / 2;
            --delay: 180ms;
        }

        /* Hero */
        .hero-ready,
        .hero-done {
            display: flex;
            align-items: center;
            gap: var(--s3);
        }

        .hero-ready > div:last-child,
        .hero-done > div:last-child,
        .tab-head {
            min-width: 0;
        }

        .hero-mark {
            width: 48px;
            height: 48px;
            flex: none;
        }

        .ask-mark {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--accent-soft);
            color: var(--accent);
            display: grid;
            place-items: center;
            flex: none;
        }

        .hero-title {
            font-size: var(--t-md);
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            text-wrap: balance;
        }

        .hero-sub {
            color: var(--muted);
            font-size: var(--t-sm);
            margin-top: 2px;
            text-wrap: pretty;
        }

        .hero-run {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--s3);
            padding-bottom: 6px;
        }

        .count {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .count .big {
            font-size: var(--t-hero);
            font-weight: 650;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .count .of {
            color: var(--muted);
            font-size: var(--t-base);
        }

        .tab-head {
            flex: 1;
        }

        /* A single-tab result names a host, which can be long. */
        body[data-state="tab-done"] #doneTitle,
        body[data-state="tab-stopped"] #stopTitle {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-big {
            font-size: var(--t-lg);
            font-weight: 650;
            line-height: 1.2;
            letter-spacing: -0.015em;
        }

        .badge {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            flex: none;
            display: grid;
            place-items: center;
        }

        .badge.ok {
            background: var(--ok-fill);
            color: var(--on-ok);
        }

        .badge.warn {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .badge.stop {
            background: var(--surface-2);
            color: var(--muted);
        }

        .badge::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 2px solid var(--ok-fill);
            opacity: 0;
        }

        .badge svg {
            opacity: 0;
            transform: scale(0.6);
        }

        .v.on .badge {
            animation: badge-in var(--d-slow) var(--spring-pop) calc(var(--delay) + 40ms) both;
        }

        .v.on .badge svg {
            animation: glyph-in var(--d-base) var(--ease-out) 260ms both;
        }

        .v.on .badge.ok::after {
            animation: ring 700ms var(--ease-out) 260ms both;
        }

        @keyframes badge-in {
            from {
                transform: scale(0.55);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes glyph-in {
            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes ring {
            from {
                transform: scale(1);
                opacity: 0.45;
            }

            to {
                transform: scale(1.7);
                opacity: 0;
            }
        }

        /* Buttons */
        .btn {
            appearance: none;
            border: 1px solid transparent;
            border-radius: var(--r-md);
            cursor: pointer;
            font-weight: 600;
            transition: background-color var(--d-fast) var(--ease-out), transform var(--d-instant) var(--ease-out);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            cursor: default;
        }

        .btn:focus-visible,
        .back:focus-visible,
        .link:focus-visible,
        .ta:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-primary {
            width: 100%;
            height: 44px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: var(--t-md);
            box-shadow: var(--shadow-btn);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-primary:active:not(:disabled) {
            background: var(--accent-press);
        }

        .btn-primary:disabled {
            opacity: 0.6;
        }

        .btn-primary svg {
            transition: transform var(--d-medium) var(--ease-out);
        }

        .btn-primary:hover:not(:disabled) svg {
            transform: rotate(-60deg);
        }

        .btn-quiet {
            height: 32px;
            padding: 0 12px;
            background: var(--surface-2);
            color: var(--text);
            font-size: var(--t-base);
            font-weight: 500;
            border-color: var(--line);
        }

        .btn-quiet:hover:not(:disabled) {
            background: var(--line);
        }

        .btn-danger {
            height: 32px;
            padding: 0 12px;
            background: transparent;
            color: var(--bad);
            border-color: var(--line);
            font-size: var(--t-base);
            font-weight: 500;
        }

        .btn-danger:hover {
            background: var(--bad-soft);
        }

        .link {
            appearance: none;
            border: 0;
            background: none;
            min-height: 24px;
            padding: 0 4px;
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            font-size: var(--t-sm);
            border-radius: 4px;
        }

        /* Progress track */
        .track-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
        }

        .track {
            position: relative;
            height: 8px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            overflow: hidden;
        }

        .fill {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: var(--accent);
            transform: translateX(-100%);
            will-change: transform;
            overflow: hidden;
        }

        .sheen {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.45) 50%, transparent 100%);
            transform: translateX(-100%);
            animation: sheen 1.6s linear infinite;
        }

        body:not([data-state="running"]):not([data-state="tab-running"]) .sheen {
            animation: none;
            opacity: 0;
        }

        @keyframes sheen {
            to {
                transform: translateX(100%);
            }
        }

        .track-meta {
            display: flex;
            justify-content: space-between;
            gap: var(--s2);
            color: var(--muted);
            font-size: var(--t-sm);
        }

        body[data-single] #progressPercent {
            visibility: hidden;
        }

        /* Detail */
        .detail-ready {
            display: flex;
            flex-direction: column;
            gap: var(--s3);
        }

        .explain {
            margin: 0;
            color: var(--muted);
            font-size: var(--t-sm);
            line-height: 1.45;
            text-wrap: pretty;
        }

        #retryFailed {
            align-self: flex-start;
        }

        .explain b {
            color: var(--text);
            font-weight: 600;
        }

        .line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--r-md);
            background: var(--surface);
            font-size: var(--t-sm);
            color: var(--muted);
            min-width: 0;
        }

        .line i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex: none;
        }

        .detail-run,
        .detail-tab {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 24px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 24px;
            padding: 0 9px;
            border-radius: var(--r-pill);
            background: var(--surface);
            border: 1px solid var(--line-soft);
            font-size: var(--t-sm);
            color: var(--muted);
            animation: chip-in var(--d-base) var(--spring-settle) both;
        }

        .chip[hidden],
        .chips[hidden] {
            display: none;
        }

        .chip i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: block;
        }

        .chip b {
            color: var(--text);
            font-weight: 600;
        }

        .chip.ok i {
            background: var(--ok-fill);
        }

        .chip.bad i {
            background: var(--bad);
        }

        .chip.skip i {
            box-shadow: inset 0 0 0 1.5px var(--muted);
        }

        @keyframes chip-in {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .dots {
            --dot: 10px;
            --gap: 4px;
            display: grid;
            grid-template-columns: repeat(auto-fill, var(--dot));
            justify-content: space-between;
            gap: var(--gap);
            align-content: start;
            max-height: 58px;
            overflow: hidden;
        }

        .dot {
            width: var(--dot);
            height: var(--dot);
            border-radius: 3px;
            background: var(--dot-pending);
            transition: background-color var(--d-base) var(--ease-out), opacity var(--d-base) var(--ease-out);
            animation: dot-in var(--d-base) var(--ease-out) both;
            animation-delay: min(calc(var(--i) * 5ms), 260ms);
        }

        .dot[data-status] {
            animation: dot-pop var(--d-medium) var(--spring-pop) both;
        }

        .dot[data-status="success"] {
            background: var(--ok-fill);
        }

        .dot[data-status="error"] {
            background: var(--bad);
        }

        .dot[data-status="skipped"] {
            background: transparent;
            box-shadow: inset 0 0 0 1.5px var(--muted);
        }

        .dots.static .dot {
            animation: none;
        }

        /* After a stop, tabs that never ran stay visibly unfinished but quiet. */
        .dots.settled .dot:not([data-status]) {
            opacity: 0.45;
        }

        @keyframes dot-in {
            from {
                opacity: 0;
                transform: scale(0.4);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes dot-pop {
            from {
                transform: scale(0.55);
            }

            to {
                transform: none;
            }
        }

        .foot {
            display: grid;
            font-size: var(--t-sm);
            color: var(--muted);
            line-height: 1.4;
        }

        .foot > span {
            grid-area: 1 / 1;
            transition: opacity var(--d-base) var(--ease-out);
        }

        .foot > span:not(.on) {
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--d-base) var(--ease-out), visibility 0s linear var(--d-base);
        }

        .foot b {
            color: var(--text);
            font-weight: 600;
        }

        .detail-failed {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            height: 100%;
        }

        .fails {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: var(--r-md);
            overflow: auto;
            flex: 1 1 auto;
            min-height: 0;
            overscroll-behavior: contain;
        }

        .fails[hidden] {
            display: none;
        }

        /* Chrome makes these scroll areas focusable; keep their ring inside the frame. */
        .fails:focus-visible,
        .view.sub:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .card h2:focus {
            outline: none;
        }

        .fails li {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr);
            column-gap: 10px;
            padding: 7px 10px;
        }

        .fails li + li {
            border-top: 1px solid var(--line-soft);
        }

        .fails i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bad);
            margin-top: 6px;
        }

        .fails b {
            font-weight: 600;
            font-size: var(--t-base);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fails span {
            grid-column: 2;
            color: var(--muted);
            font-size: var(--t-sm);
            overflow-wrap: anywhere;
        }

        .detail-ask {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        /* Secondary action: a quiet text button at the bottom of the detail slot,
           far from the primary button. */
        .ta-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .ta {
            appearance: none;
            border: 0;
            background: none;
            height: 28px;
            margin-left: -8px;
            padding: 0 8px;
            border-radius: var(--r-sm);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            max-width: calc(100% + 8px);
            cursor: pointer;
            color: var(--accent);
            font-size: var(--t-base);
            font-weight: 600;
            transition: background-color var(--d-fast) var(--ease-out);
        }

        .ta:hover:not(:disabled):not([aria-disabled="true"]) {
            background: var(--accent-soft);
        }

        .ta:disabled,
        .ta[aria-disabled="true"] {
            color: var(--muted);
            cursor: not-allowed;
        }

        .ta[aria-disabled="true"]:hover {
            background: none;
        }

        .ta svg,
        .ta .lbl {
            flex: none;
        }

        .ta .site {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-weight: 500;
        }

        .ta .site::before {
            content: "\00b7";
            margin-right: 6px;
        }

        .ta .site:empty {
            display: none;
        }

        .ta-note {
            max-width: 100%;
            text-wrap: pretty;
            color: var(--muted);
            font-size: var(--t-sm);
            line-height: 1.35;
        }

        /* Grouped list of secondary views */
        .list {
            flex: none;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            overflow: hidden;
        }

        .row {
            appearance: none;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: background-color var(--d-fast) var(--ease-out);
        }

        .row + .row {
            border-top: 1px solid var(--line-soft);
        }

        .row:hover {
            background: var(--surface-2);
        }

        /* The list clips its children, so the ring is drawn inside the row. */
        .row:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
            border-radius: var(--r-lg);
        }

        .row .ic,
        .row .chev {
            color: var(--muted);
            flex: none;
        }

        .row .lbl {
            flex: none;
        }

        .row .meta {
            margin-left: auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--muted);
            font-size: var(--t-sm);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .row .chev {
            transition: transform var(--d-fast) var(--ease-out);
        }

        .row:hover .chev {
            transform: translateX(2px);
        }

        /* Sub views */
        .view.sub {
            padding: 0 var(--s4) var(--s4);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }

        .panel[hidden] {
            display: none;
        }

        .hist {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            overflow: hidden;
            background: var(--surface);
        }

        .hist li {
            display: grid;
            grid-template-columns: 8px minmax(0, 1fr) auto;
            column-gap: 10px;
            align-items: baseline;
            padding: 9px 12px;
        }

        .hist li + li {
            border-top: 1px solid var(--line-soft);
        }

        .hist i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok-fill);
            align-self: center;
        }

        .hist i.bad {
            background: var(--bad);
        }

        .hist i.stop {
            background: transparent;
            box-shadow: inset 0 0 0 1.5px var(--muted);
        }

        .hist b {
            font-weight: 600;
        }

        .hist .when {
            color: var(--muted);
            font-size: var(--t-sm);
            white-space: nowrap;
        }

        .hist .sub2 {
            grid-column: 2 / 4;
            color: var(--muted);
            font-size: var(--t-sm);
        }

        .hist .empty {
            display: block;
            color: var(--muted);
        }

        .reveal > li {
            animation: row-in var(--d-base) var(--ease-out) both;
            animation-delay: calc(var(--i) * 30ms + 120ms);
        }

        @keyframes row-in {
            from {
                opacity: 0;
                transform: translateY(var(--shift));
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .card {
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
            padding: 12px;
        }

        .card + .card {
            margin-top: 10px;
        }

        .card h2 {
            margin: 0;
            font-size: var(--t-base);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card p {
            margin: 6px 0 10px;
            color: var(--muted);
            font-size: var(--t-sm);
            line-height: 1.45;
            text-wrap: pretty;
        }

        .pill {
            font-size: 11.5px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--r-pill);
            background: var(--surface-2);
            color: var(--muted);
        }

        .pill.on {
            background: var(--ok-soft);
            color: var(--ok);
        }

        .fine {
            margin: 12px 2px 0;
            color: var(--muted);
            font-size: var(--t-sm);
            line-height: 1.45;
            text-wrap: pretty;
        }

        .stat-hero {
            border-radius: var(--r-lg);
            background: var(--accent-soft);
            padding: 12px 14px;
        }

        .stat-hero .lbl {
            color: var(--muted);
            font-size: var(--t-sm);
        }

        .stat-hero .val {
            font-size: var(--t-hero);
            font-weight: 650;
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .stat-hero small {
            font-size: var(--t-sm);
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0;
            margin-right: 6px;
        }

        .stats {
            margin: 10px 0 0;
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            background: var(--surface);
        }

        .stats div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            font-size: var(--t-base);
        }

        .stats div + div {
            border-top: 1px solid var(--line-soft);
        }

        .stats dt {
            color: var(--muted);
        }

        .stats dd {
            margin: 0;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stats small {
            font-weight: 500;
            color: var(--muted);
            margin-right: 4px;
        }

        .hint {
            margin: 10px 0 0;
            padding: 10px 12px;
            border-radius: var(--r-md);
            background: var(--surface);
            border: 1px dashed var(--line);
            font-size: var(--t-sm);
            color: var(--muted);
        }

        .hint[hidden],
        .undo[hidden],
        .btn[hidden] {
            display: none;
        }

        .undo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: 32px;
            font-size: var(--t-sm);
            color: var(--text);
        }

        #confetti {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #confetti[hidden] {
            display: none;
        }
    </style>
</head>
