name: Extended Reliability

on:
  pull_request:
    paths:
      - background.js
      - content-script.js
      - popup.html
      - popup.js
      - manifest.json
      - package.json
      - package-lock.json
      - tests/e2e/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - background.js
      - content-script.js
      - popup.html
      - popup.js
      - manifest.json
      - package.json
      - package-lock.json
      - tests/e2e/**
      - .github/workflows/**
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Reliability profile to run
        required: true
        default: full
        type: choice
        options:
          - full
          - medium

permissions:
  contents: read

jobs:
  medium:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'medium') }}
    name: 20-tab reliability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run medium reliability profile
        run: xvfb-run --auto-servernum npm run e2e:reliability:medium
      - name: Upload reliability diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medium-reliability-diagnostics
          path: test-results/e2e/medium/
          if-no-files-found: ignore
          retention-days: 14

  full:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full') }}
    name: 50-tab reliability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run full reliability profile
        run: xvfb-run --auto-servernum npm run e2e:reliability
      - name: Upload reliability diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-reliability-diagnostics
          path: test-results/e2e/full/
          if-no-files-found: ignore
          retention-days: 14
