name: Fast CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Unit, essential E2E, and reliability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run unit and integration tests
        run: npm test -- --runInBand
      - name: Run essential E2E and 8-tab smoke tests
        run: xvfb-run --auto-servernum npm run e2e
      - name: Run packaged-extension smoke test
        run: xvfb-run --auto-servernum npm run e2e:package
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-e2e-diagnostics
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
